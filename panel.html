<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>計器モニタ | SideCar / 別窓ディスプレイ</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23232932'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='13' font-weight='bold' fill='white' text-anchor='middle'%3ELCD%3C/text%3E%3C/svg%3E"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,600;0,700;0,800;1,700;1,800&family=JetBrains+Mono:ital,wght@0,700;1,700&family=Noto+Sans+JP:wght@600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: #0a0d11;
        overflow: hidden;
      }

      .meter-bezel {
        width: 100%;
        height: 100%;
        padding: clamp(4px, 1.1vmin, 14px);
        background: linear-gradient(180deg, #161a20 0%, #0b0e12 100%);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .meter-screen {
        width: 100%;
        height: 100%;
        background: #14181e;
        border: 2px solid #05070a;
        border-radius: 4px;
        box-shadow:
          inset 0 1px 4px rgba(0, 0, 0, 0.85),
          0 0 0 1px rgba(255, 255, 255, 0.06);
        overflow: hidden;
        position: relative;
      }

      #meter-canvas {
        width: 100%;
        height: 100%;
        display: block;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <main class="meter-bezel" aria-label="運転台 計器モニタ">
      <div class="meter-screen">
        <canvas id="meter-canvas"></canvas>
      </div>
    </main>
    <script type="module" src="./src/panel.js"></script>
  </body>
</html>
